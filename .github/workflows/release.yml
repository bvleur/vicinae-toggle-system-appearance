name: Release

# Pushing a tag like v1.0.0 builds the extension and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # `vici build` writes the built extension to ~/.local/share/vicinae/extensions/<name>
      - run: npm run build
      - name: Package
        run: tar -czf toggle-system-appearance.tar.gz -C "$HOME/.local/share/vicinae/extensions/toggle-system-appearance" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" toggle-system-appearance.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
